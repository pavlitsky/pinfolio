# Name of your application. Used to uniquely configure containers.
service: pinfolio

# Name of the container image.
image: pinfolio

# Deploy to the DigitalOcean droplet. Its IP is read from the environment so it stays
# out of the public repository: KAMAL_HOST=203.0.113.10 bin/kamal deploy
servers:
  web:
    - <%= ENV.fetch("KAMAL_HOST") %>

# kamal-proxy serves the app on port 80 of the droplet over plain HTTP.
# To add HTTPS later: point a domain's A record at the droplet, uncomment below,
# and turn on config.assume_ssl and config.force_ssl in production.rb.
#
# proxy:
#   ssl: true
#   host: pinfolio.example.com

# Kamal's built-in local registry: the image is pushed from this machine to the
# droplet through an SSH tunnel, so no external registry account is needed.
registry:
  server: localhost:5555

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    SOLID_QUEUE_IN_PUMA: true

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Persistent volume for the SQLite databases and the downloaded images (Active Storage).
# Enable DigitalOcean droplet backups to keep a copy off the server.
volumes:
  - "pinfolio_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Droplets are amd64. On an Apple Silicon Mac the image is cross-built under emulation,
# which is slow; to build on the droplet itself instead, uncomment:
#   remote: ssh://root@<%= ENV["KAMAL_HOST"] %>
builder:
  arch: amd64

# DigitalOcean droplets log in as root by default.
ssh:
  user: root
